[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clima"
version = "0.1.0"
description = "An empty Python project for data analysis and machine learning."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "seaborn",
    "scikit-learn",
    "scipy",
]

[tool.setuptools.packages.find]
where = ["src"]
